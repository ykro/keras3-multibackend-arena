[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keras3-multibackend-arena"
version = "0.1.0"
description = "Keras 3 Multi-Backend Arena: Write Once with keras.ops, Benchmark JAX (OpenXLA) vs PyTorch, and Serve on Cloud Run"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Adrián Catalán" }
]
dependencies = [
  "keras>=3.14.0",
  "jax>=0.9.0",
  "torch>=2.5.0",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["N999", "E402"]

