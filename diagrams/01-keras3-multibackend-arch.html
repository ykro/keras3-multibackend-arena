<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keras 3 Multi-Backend Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F7F6F2;
      --color-paper-2: #EFECE6;
      --color-ink:     #0F2547;
      --color-muted:   #3B5B8C;
      --color-accent:  #C59216;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 2rem;
    }

    .frame { max-width: 1120px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Keras 3 Multi-Backend Arena</p>
    <h1>Write Once with keras.ops, Dispatch to JAX (OpenXLA), PyTorch, or NumPy</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="keras3-arch-title keras3-arch-desc">
        <title id="keras3-arch-title">Keras 3 Multi-Backend Architecture</title>
        <desc id="keras3-arch-desc">Architecture diagram showing a single multimodal keras.ops model dispatching to JAX with OpenXLA fusion, PyTorch eager execution, or NumPy verification, and exporting a portable .keras artifact served by a local HTTP smoke test.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#3B5B8C"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#C59216"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#0F2547"/>
          </marker>
        </defs>

        <!-- Clean warm paper background -->
        <rect width="100%" height="100%" fill="#F7F6F2"/>

        <!-- Zones (drawn before arrows and nodes) -->
        <!-- Zone 1: Unified Model Definition -->
        <rect x="32" y="36" width="236" height="424" rx="8" fill="rgba(15,37,71,0.02)" stroke="rgba(15,37,71,0.12)" stroke-width="0.8"/>
        <rect x="52" y="40" width="148" height="12" rx="2" fill="#F7F6F2"/>
        <text x="126" y="49" fill="#3B5B8C" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">UNIFIED MODEL LAYER</text>

        <!-- Zone 2: Backend Dispatchers -->
        <rect x="348" y="36" width="264" height="424" rx="8" fill="rgba(15,37,71,0.02)" stroke="rgba(15,37,71,0.12)" stroke-width="0.8"/>
        <rect x="368" y="40" width="164" height="12" rx="2" fill="#F7F6F2"/>
        <text x="450" y="49" fill="#3B5B8C" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">KERAS_BACKEND RUNTIME</text>

        <!-- Zone 3: Portable Artifact & Serving -->
        <rect x="692" y="36" width="236" height="424" rx="8" fill="rgba(15,37,71,0.02)" stroke="rgba(15,37,71,0.12)" stroke-width="0.8"/>
        <rect x="712" y="40" width="164" height="12" rx="2" fill="#F7F6F2"/>
        <text x="794" y="49" fill="#3B5B8C" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PORTABLE ARTIFACT</text>

        <!-- Arrows (drawn before boxes, strictly orthogonal) -->
        <!-- Input tensors -> Multimodal keras.ops Graph -->
        <line x1="150" y1="164" x2="150" y2="216" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Multimodal keras.ops Graph -> JAX OpenXLA Backend (top fan point y=240 -> y=124) -->
        <path d="M 244,240 H 296 Q 304,240 304,232 V 132 Q 304,124 312,124 H 376" fill="none" stroke="#C59216" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
        <rect x="312" y="104" width="60" height="12" rx="2" fill="#F7F6F2"/>
        <text x="342" y="113" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JIT + XLA</text>

        <!-- Multimodal keras.ops Graph -> PyTorch Backend (middle fan point y=260 -> y=260) -->
        <line x1="244" y1="260" x2="376" y2="260" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="312" y="240" width="56" height="12" rx="2" fill="#F7F6F2"/>
        <text x="340" y="249" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EAGER</text>

        <!-- Multimodal keras.ops Graph -> NumPy Backend (bottom fan point y=280 -> y=396) -->
        <path d="M 244,280 H 296 Q 304,280 304,288 V 388 Q 304,396 312,396 H 376" fill="none" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="312" y="376" width="56" height="12" rx="2" fill="#F7F6F2"/>
        <text x="340" y="385" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEBUG</text>

        <!-- JAX Backend -> Portable .keras Archive -->
        <path d="M 584,124 H 644 Q 652,124 652,132 V 176 Q 652,184 660,184 H 716" fill="none" stroke="#C59216" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
        <rect x="588" y="104" width="60" height="12" rx="2" fill="#F7F6F2"/>
        <text x="618" y="113" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE WTS</text>

        <!-- Portable .keras Archive -> PyTorch Backend (reload parity check) -->
        <path d="M 716,204 H 660 Q 652,204 652,212 V 252 Q 652,260 644,260 H 584" fill="none" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="588" y="268" width="60" height="12" rx="2" fill="#F7F6F2"/>
        <text x="618" y="277" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARITY</text>

        <!-- Portable .keras Archive -> Cloud Run Scale-to-Zero -->
        <line x1="810" y1="236" x2="810" y2="332" stroke="#0F2547" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="820" y="276" width="68" height="12" rx="2" fill="#F7F6F2"/>
        <text x="854" y="285" fill="#0F2547" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SERVE HTTP</text>

        <!-- Nodes (all coordinates on 4px grid) -->
        <!-- Node 1: Vision + Tabular Inputs -->
        <rect x="56" y="76" width="188" height="88" rx="6" fill="#F7F6F2"/>
        <rect x="56" y="76" width="188" height="88" rx="6" fill="#EFECE6" stroke="#3B5B8C" stroke-width="1"/>
        <rect x="64" y="84" width="40" height="12" rx="2" fill="transparent" stroke="rgba(59,91,140,0.45)" stroke-width="0.8"/>
        <text x="84" y="93" fill="#3B5B8C" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
        <text x="150" y="122" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Multimodal Inputs</text>
        <text x="150" y="140" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vision(B,16,64) + tab(B,32)</text>

        <!-- Node 2: Pure keras.ops Model (Focal 1) -->
        <rect x="56" y="216" width="188" height="96" rx="6" fill="#F7F6F2"/>
        <rect x="56" y="216" width="188" height="96" rx="6" fill="rgba(197,146,22,0.12)" stroke="#C59216" stroke-width="1.5"/>
        <rect x="64" y="224" width="44" height="12" rx="2" fill="transparent" stroke="rgba(197,146,22,0.55)" stroke-width="0.8"/>
        <text x="86" y="233" fill="#9A6F0B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="150" y="264" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gated Residual Net</text>
        <text x="150" y="282" fill="#9A6F0B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keras.ops.matmul / gelu</text>
        <text x="150" y="296" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">657,418 trainable params</text>

        <!-- Node 3: JAX + OpenXLA Backend (Focal 2) -->
        <rect x="376" y="76" width="208" height="96" rx="6" fill="#F7F6F2"/>
        <rect x="376" y="76" width="208" height="96" rx="6" fill="rgba(197,146,22,0.12)" stroke="#C59216" stroke-width="1.5"/>
        <rect x="384" y="84" width="44" height="12" rx="2" fill="transparent" stroke="rgba(197,146,22,0.55)" stroke-width="0.8"/>
        <text x="406" y="93" fill="#9A6F0B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FAST</text>
        <text x="480" y="122" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JAX + OpenXLA</text>
        <text x="480" y="140" fill="#9A6F0B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KERAS_BACKEND=jax</text>
        <text x="480" y="156" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HLO kernel fusion · stateless</text>

        <!-- Node 4: PyTorch Backend -->
        <rect x="376" y="216" width="208" height="88" rx="6" fill="#F7F6F2"/>
        <rect x="376" y="216" width="208" height="88" rx="6" fill="#EFECE6" stroke="#0F2547" stroke-width="1"/>
        <rect x="384" y="224" width="48" height="12" rx="2" fill="transparent" stroke="rgba(15,37,71,0.40)" stroke-width="0.8"/>
        <text x="408" y="233" fill="#0F2547" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TORCH</text>
        <text x="480" y="262" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PyTorch Eager</text>
        <text x="480" y="280" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KERAS_BACKEND=torch</text>

        <!-- Node 5: NumPy Backend -->
        <rect x="376" y="352" width="208" height="88" rx="6" fill="#F7F6F2"/>
        <rect x="376" y="352" width="208" height="88" rx="6" fill="#EFECE6" stroke="#3B5B8C" stroke-width="1" stroke-dasharray="5,4"/>
        <rect x="384" y="360" width="48" height="12" rx="2" fill="transparent" stroke="rgba(59,91,140,0.40)" stroke-width="0.8"/>
        <text x="408" y="369" fill="#3B5B8C" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NUMPY</text>
        <text x="480" y="398" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">NumPy Reference</text>
        <text x="480" y="416" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KERAS_BACKEND=numpy</text>

        <!-- Node 6: Portable .keras Archive -->
        <rect x="716" y="148" width="188" height="88" rx="6" fill="#F7F6F2"/>
        <rect x="716" y="148" width="188" height="88" rx="6" fill="#EFECE6" stroke="#0F2547" stroke-width="1.2"/>
        <rect x="724" y="156" width="48" height="12" rx="2" fill="transparent" stroke="rgba(15,37,71,0.40)" stroke-width="0.8"/>
        <text x="748" y="165" fill="#0F2547" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="810" y="194" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Portable .keras</text>
        <text x="810" y="212" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">np.allclose(atol=1e-5)</text>

        <!-- Node 7: Cloud Run Scale-to-Zero -->
        <rect x="716" y="332" width="188" height="96" rx="6" fill="#F7F6F2"/>
        <rect x="716" y="332" width="188" height="96" rx="6" fill="#EFECE6" stroke="#0F2547" stroke-width="1"/>
        <rect x="724" y="340" width="48" height="12" rx="2" fill="transparent" stroke="rgba(15,37,71,0.40)" stroke-width="0.8"/>
        <text x="748" y="349" fill="#0F2547" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL</text>
        <text x="810" y="378" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HTTP Endpoint</text>
        <text x="810" y="396" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local smoke test</text>
        <text x="810" y="412" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">POST /predict :8080</text>

        <!-- Horizontal bottom legend strip -->
        <line x1="32" y1="492" x2="928" y2="492" stroke="rgba(15,37,71,0.14)" stroke-width="0.8"/>
        <text x="32" y="516" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="112" y="508" width="12" height="10" rx="2" fill="rgba(197,146,22,0.12)" stroke="#C59216" stroke-width="1.5"/>
        <text x="132" y="516" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif">Focal Path (keras.ops + JAX/OpenXLA)</text>

        <rect x="348" y="508" width="12" height="10" rx="2" fill="#EFECE6" stroke="#0F2547" stroke-width="1"/>
        <text x="368" y="516" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif">Standard Runtime / Artifact</text>

        <rect x="548" y="508" width="12" height="10" rx="2" fill="#EFECE6" stroke="#3B5B8C" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="568" y="516" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif">Verification / Parity Check</text>
      </svg>
    </div>
  </div>
</body>
</html>
