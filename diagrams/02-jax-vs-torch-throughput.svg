<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jax-torch-bar-title jax-torch-bar-desc" id="d-02-jax-vs-torch-throughput-root">
        <title id="jax-torch-bar-title">Keras 3 JAX vs PyTorch Steady-State Throughput</title>
        <desc id="jax-torch-bar-desc">Column bar chart comparing steady-state samples per second and step latency in milliseconds between KERAS_BACKEND=jax compiled on CPU and KERAS_BACKEND=torch eager on Apple MPS on the 657,418-parameter multimodal residual model.</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-02-jax-vs-torch-throughput-root { --color-paper:   #F7F6F2;
      --color-paper-2: #EFECE6;
      --color-ink:     #0F2547;
      --color-muted:   #3B5B8C;
      --color-accent:  #C59216;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-02-jax-vs-torch-throughput-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-02-jax-vs-torch-throughput-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-02-jax-vs-torch-throughput-root .diagram-container { overflow-x: visible; }</style>
  </defs>

        <rect width="100%" height="100%" fill="#F7F6F2"/>

        <!-- Y-axis gridlines: domain 0 to 60,000 samples/sec across y=400 (0) to y=40 (60,000) -> 6px per 1,000 samples/sec -->
        <line x1="88" y1="340" x2="960" y2="340" stroke="#0f2547" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="80" y="343" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">10,000</text>

        <line x1="88" y1="280" x2="960" y2="280" stroke="#0f2547" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="80" y="283" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">20,000</text>

        <line x1="88" y1="220" x2="960" y2="220" stroke="#0f2547" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="80" y="223" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">30,000</text>

        <line x1="88" y1="160" x2="960" y2="160" stroke="#0f2547" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="80" y="163" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">40,000</text>

        <line x1="88" y1="100" x2="960" y2="100" stroke="#0f2547" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="80" y="103" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">50,000</text>

        <line x1="88" y1="40" x2="960" y2="40" stroke="#0f2547" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="80" y="43" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">60,000</text>

        <text x="80" y="403" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

        <!-- Bar 1: JAX Train (train_on_batch) = 23,539.6 samples/s (10.875 ms/step) -> height=141, y=259 (Focal 1) -->
        <rect x="136" y="251.2" width="96" height="148.8" fill="#F7F6F2"/>
        <rect x="136" y="251.2" width="96" height="148.8" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.5"/>
        <text x="184" y="241.2" fill="#9A6F0B" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">24,794.8 /s</text>
        <text x="184" y="229.2" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">10.325 ms/step (2.00x)</text>
        <text x="184" y="422" fill="#0F2547" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JAX Train</text>
        <text x="184" y="436" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">KERAS_BACKEND=jax</text>

        <!-- Bar 2: PyTorch Train (train_on_batch) = 12,252.2 samples/s (20.894 ms/step) -> height=72, y=328 -->
        <rect x="284" y="325.6" width="96" height="74.4" fill="#F7F6F2"/>
        <rect x="284" y="325.6" width="96" height="74.4" fill="#3b5b8c" fill-opacity="0.15" stroke="#3B5B8C" stroke-width="1"/>
        <text x="332" y="315.6" fill="#0F2547" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">12,401.3 /s</text>
        <text x="332" y="303.6" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">20.643 ms/step (1.00x)</text>
        <text x="332" y="422" fill="#0F2547" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PyTorch Train</text>
        <text x="332" y="436" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">KERAS_BACKEND=torch</text>

        <!-- Bar 3: JAX Custom Stateless Loop = 23,734.5 samples/s (10.786 ms/step) -> height=144, y=256 -->
        <rect x="448" y="244.3" width="96" height="155.7" fill="#F7F6F2"/>
        <rect x="448" y="244.3" width="96" height="155.7" fill="#3b5b8c" fill-opacity="0.15" stroke="#0F2547" stroke-width="1.2"/>
        <text x="496" y="234.3" fill="#0F2547" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">25,946.4 /s</text>
        <text x="496" y="222.3" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">9.866 ms/step (SGD)</text>
        <text x="496" y="422" fill="#0F2547" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JAX Stateless</text>
        <text x="496" y="436" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">value_and_grad</text>

        <!-- Bar 4: JAX Eval (test_on_batch) = 52,708.9 samples/s (4.857 ms/step) -> height=316, y=84 (Focal 2) -->
        <rect x="628" y="67.1" width="96" height="332.9" fill="#F7F6F2"/>
        <rect x="628" y="67.1" width="96" height="332.9" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.5"/>
        <text x="676" y="57.1" fill="#9A6F0B" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">55,482.9 /s</text>
        <text x="676" y="45.1" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">4.614 ms/step (1.82x)</text>
        <text x="676" y="422" fill="#0F2547" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JAX Inference</text>
        <text x="676" y="436" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">KERAS_BACKEND=jax</text>

        <!-- Bar 5: PyTorch Eval (test_on_batch) = 28,586.9 samples/s (8.955 ms/step) -> height=172, y=228 -->
        <rect x="776" y="217.4" width="96" height="182.6" fill="#F7F6F2"/>
        <rect x="776" y="217.4" width="96" height="182.6" fill="#3b5b8c" fill-opacity="0.15" stroke="#3B5B8C" stroke-width="1"/>
        <text x="824" y="207.4" fill="#0F2547" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">30,435.1 /s</text>
        <text x="824" y="195.4" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">8.411 ms/step (1.00x)</text>
        <text x="824" y="422" fill="#0F2547" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PyTorch Inference</text>
        <text x="824" y="436" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">KERAS_BACKEND=torch</text>

        <!-- Y-axis and X-axis lines -->
        <line x1="88" y1="40" x2="88" y2="400" stroke="#0f2547" stroke-opacity="0.28" stroke-width="1"/>
        <line x1="88" y1="400" x2="960" y2="400" stroke="#0f2547" stroke-opacity="0.28" stroke-width="1"/>

        <!-- Horizontal bottom legend strip -->
        <line x1="36" y1="472" x2="960" y2="472" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <text x="36" y="496" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="116" y="488" width="12" height="10" rx="2" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.5"/>
        <text x="136" y="496" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif">KERAS_BACKEND=jax (OpenXLA JIT)</text>

        <rect x="348" y="488" width="12" height="10" rx="2" fill="#3b5b8c" fill-opacity="0.15" stroke="#0F2547" stroke-width="1.2"/>
        <text x="368" y="496" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif">Custom Stateless JAX (SGD, not comparable)</text>

        <rect x="596" y="488" width="12" height="10" rx="2" fill="#3b5b8c" fill-opacity="0.15" stroke="#3B5B8C" stroke-width="1"/>
        <text x="616" y="496" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif">KERAS_BACKEND=torch (eager, MPS)</text>
      </svg>
