<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stateless JAX Training and Cloud Run Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F7F6F2;
      --color-paper-2: #EFECE6;
      --color-ink:     #0F2547;
      --color-muted:   #3B5B8C;
      --color-accent:  #C59216;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 2rem;
    }

    .frame { max-width: 1120px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data Flow · Pure Functional JAX Bridge</p>
    <h1>From model.stateless_call Inside jax.value_and_grad to Scale-to-Zero Serving</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stateless-flow-title stateless-flow-desc">
        <title id="stateless-flow-title">Stateless JAX Training and Cloud Run Export Flow</title>
        <desc id="stateless-flow-desc">Data flow diagram showing how Keras 3 trainable and non-trainable variable PyTrees enter model.stateless_call inside a JIT-compiled jax.value_and_grad step, update parameters functionally, sync back to the Keras model, and deploy to Cloud Run.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#3B5B8C"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#C59216"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#0F2547"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#F7F6F2"/>

        <!-- Zone: @jax.jit Compiled Functional Boundary -->
        <rect x="268" y="44" width="400" height="264" rx="8" fill="rgba(15,37,71,0.02)" stroke="rgba(15,37,71,0.14)" stroke-width="0.8" stroke-dasharray="5,4"/>
        <rect x="288" y="48" width="212" height="12" rx="2" fill="#F7F6F2"/>
        <text x="394" y="57" fill="#3B5B8C" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">@JAX.JIT PURE FUNCTIONAL SCOPE</text>

        <!-- Arrows (drawn before boxes) -->
        <!-- Node 1 (PyTree State) -> Node 2 (model.stateless_call) -->
        <line x1="204" y1="136" x2="296" y2="136" stroke="#C59216" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
        <rect x="208" y="116" width="52" height="12" rx="2" fill="#F7F6F2"/>
        <text x="234" y="125" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PYTREES</text>

        <!-- Node 2 (model.stateless_call) -> Node 3 (jax.value_and_grad) -->
        <line x1="472" y1="136" x2="504" y2="136" stroke="#C59216" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

        <!-- Node 3 (jax.value_and_grad) -> Node 4 (tree_map update) -->
        <line x1="580" y1="184" x2="580" y2="216" stroke="#C59216" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

        <!-- Loop back from Node 4 (tree_map) to Node 2 (stateless_call) for next step -->
        <path d="M 504,252 H 392 Q 384,252 384,244 V 184" fill="none" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="408" y="232" width="76" height="12" rx="2" fill="#F7F6F2"/>
        <text x="446" y="241" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT STEP</text>

        <!-- Node 4 (tree_map) -> Node 5 (var.assign & model.save) -->
        <line x1="656" y1="252" x2="736" y2="252" stroke="#0F2547" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="676" y="232" width="52" height="12" rx="2" fill="#F7F6F2"/>
        <text x="702" y="241" fill="#0F2547" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ASSIGN</text>

        <!-- Node 5 (model.save) -> Node 6 (Cloud Run Endpoint) -->
        <line x1="828" y1="296" x2="828" y2="340" stroke="#0F2547" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Nodes (all on 4px grid) -->
        <!-- Node 1: Extracted Variable PyTrees -->
        <rect x="36" y="88" width="168" height="96" rx="6" fill="#F7F6F2"/>
        <rect x="36" y="88" width="168" height="96" rx="6" fill="#EFECE6" stroke="#0F2547" stroke-width="1"/>
        <rect x="44" y="96" width="44" height="12" rx="2" fill="transparent" stroke="rgba(15,37,71,0.40)" stroke-width="0.8"/>
        <text x="66" y="105" fill="#0F2547" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="120" y="134" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Variable PyTrees</text>
        <text x="120" y="152" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trainable_vars (t_vars)</text>
        <text x="120" y="168" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">non_trainable_vars (nt_vars)</text>

        <!-- Node 2: model.stateless_call (Focal 1) -->
        <rect x="296" y="88" width="176" height="96" rx="6" fill="#F7F6F2"/>
        <rect x="296" y="88" width="176" height="96" rx="6" fill="rgba(197,146,22,0.12)" stroke="#C59216" stroke-width="1.5"/>
        <rect x="304" y="96" width="44" height="12" rx="2" fill="transparent" stroke="rgba(197,146,22,0.55)" stroke-width="0.8"/>
        <text x="326" y="105" fill="#9A6F0B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PURE</text>
        <text x="384" y="134" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stateless Forward</text>
        <text x="384" y="152" fill="#9A6F0B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">model.stateless_call()</text>
        <text x="384" y="168" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">zero side-effects</text>

        <!-- Node 3: jax.value_and_grad (Focal 2) -->
        <rect x="504" y="88" width="152" height="96" rx="6" fill="#F7F6F2"/>
        <rect x="504" y="88" width="152" height="96" rx="6" fill="rgba(197,146,22,0.12)" stroke="#C59216" stroke-width="1.5"/>
        <rect x="512" y="96" width="44" height="12" rx="2" fill="transparent" stroke="rgba(197,146,22,0.55)" stroke-width="0.8"/>
        <text x="534" y="105" fill="#9A6F0B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GRAD</text>
        <text x="580" y="134" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auto-Diff Step</text>
        <text x="580" y="152" fill="#9A6F0B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">jax.value_and_grad</text>
        <text x="580" y="168" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">has_aux=True</text>

        <!-- Node 4: jax.tree_util.tree_map -->
        <rect x="504" y="216" width="152" height="76" rx="6" fill="#F7F6F2"/>
        <rect x="504" y="216" width="152" height="76" rx="6" fill="#EFECE6" stroke="#3B5B8C" stroke-width="1"/>
        <rect x="512" y="224" width="44" height="12" rx="2" fill="transparent" stroke="rgba(59,91,140,0.40)" stroke-width="0.8"/>
        <text x="534" y="233" fill="#3B5B8C" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP</text>
        <text x="580" y="258" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PyTree Update</text>
        <text x="580" y="276" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tree_map(clip + sgd)</text>

        <!-- Node 5: Sync & Export .keras -->
        <rect x="736" y="208" width="184" height="88" rx="6" fill="#F7F6F2"/>
        <rect x="736" y="208" width="184" height="88" rx="6" fill="#EFECE6" stroke="#0F2547" stroke-width="1"/>
        <rect x="744" y="216" width="48" height="12" rx="2" fill="transparent" stroke="rgba(15,37,71,0.40)" stroke-width="0.8"/>
        <text x="768" y="225" fill="#0F2547" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXPORT</text>
        <text x="828" y="254" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sync &amp; Save</text>
        <text x="828" y="272" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">var.assign() · .keras</text>

        <!-- Node 6: Cloud Run Scale-to-Zero -->
        <rect x="736" y="340" width="184" height="88" rx="6" fill="#F7F6F2"/>
        <rect x="736" y="340" width="184" height="88" rx="6" fill="#EFECE6" stroke="#0F2547" stroke-width="1.2"/>
        <rect x="744" y="348" width="48" height="12" rx="2" fill="transparent" stroke="rgba(15,37,71,0.40)" stroke-width="0.8"/>
        <text x="768" y="357" fill="#0F2547" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLOUD</text>
        <text x="828" y="386" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloud Run Serving</text>
        <text x="828" y="404" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">min-instances=0 · HTTP</text>

        <!-- Horizontal bottom legend strip -->
        <line x1="36" y1="456" x2="920" y2="456" stroke="rgba(15,37,71,0.14)" stroke-width="0.8"/>
        <text x="36" y="480" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="116" y="472" width="12" height="10" rx="2" fill="rgba(197,146,22,0.12)" stroke="#C59216" stroke-width="1.5"/>
        <text x="136" y="480" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif">Focal Transformation (stateless_call + value_and_grad)</text>

        <rect x="436" y="472" width="12" height="10" rx="2" fill="#EFECE6" stroke="#0F2547" stroke-width="1"/>
        <text x="456" y="480" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif">Stateful Keras / Cloud Run Stage</text>

        <line x1="656" y1="477" x2="676" y2="477" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="684" y="480" fill="#0F2547" font-size="9" font-family="'Geist', sans-serif">Iterative Functional Loop</text>
      </svg>
    </div>
  </div>
</body>
</html>
